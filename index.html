<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Avis IXINA Tour & Taxis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* Look « le prénom en monument » : le prénom du conseiller est l'architecture de la page. */
  :root {
    --bleu: #014076;
    --nuit: #102335;
    --jaune: #F9DE53;
    --pale: #EEF2F6;
    --gris: #5B6B7C;
    --police: Archivo, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--police);
    background: #fff;
    color: var(--nuit);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  body.ecran-qui { background: var(--bleu); }
  button, textarea { font-family: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--jaune); outline-offset: 2px; }

  header {
    background: var(--bleu);
    color: #fff;
    padding: calc(28px + env(safe-area-inset-top)) 20px 22px;
    overflow: hidden;
  }
  .logo { font-weight: 900; font-size: 26px; letter-spacing: -0.5px; }
  .logo span { font-weight: 400; font-size: 15px; opacity: .8; margin-left: 6px; letter-spacing: 0; }
  h1 { font-size: 22px; line-height: 1.25; font-weight: 600; margin-top: 14px; opacity: .85; }
  header p { font-size: 17px; line-height: 1.4; font-weight: 500; margin-top: 4px; }
  body.ecran-qui header p {
    font-size: 30px; font-weight: 800; font-stretch: 75%; line-height: 1.02; letter-spacing: -0.5px;
  }
  .changer {
    background: none; border: 0; padding: 0; margin-left: 4px;
    font: inherit; color: var(--jaune); text-decoration: underline;
  }

  /* Le prénom choisi, géant, coupé par le bas de l'en-tête */
  header[data-nom]:not([data-nom=""]) { padding-bottom: 0; }
  header[data-nom]:not([data-nom=""])::after {
    content: attr(data-nom); display: block;
    font-size: min(40vw, 250px); font-weight: 900; font-stretch: 62%;
    line-height: .74; letter-spacing: -0.03em;
    color: var(--jaune); margin: 18px 0 max(-6vw, -38px) -1vw;
  }

  /* Écran 1 : les prénoms à pleine largeur, sur le bleu */
  .qui { padding: 0 20px 40px; display: grid; justify-items: start; max-width: 640px; margin: 0 auto; }
  .qui button {
    text-align: left; background: none; border: 0; padding: 0; cursor: pointer;
    color: #fff; font-size: min(31vw, 190px); font-weight: 900; font-stretch: 62%;
    line-height: .86; letter-spacing: -0.02em;
  }
  .qui button:nth-child(even):not(.autre) { color: var(--jaune); }
  .qui button:active { opacity: .7; }
  .qui .autre {
    font-size: 18px; font-weight: 600; font-stretch: 100%; line-height: 1.4; letter-spacing: 0;
    color: #fff; opacity: .75; margin-top: 18px; text-decoration: underline;
  }

  /* Écran 2 : la liste en bandes pleine largeur */
  main { padding: 0 0 110px; display: grid; max-width: 640px; margin: 0 auto; }
  .avis {
    text-align: left; width: 100%; cursor: pointer;
    font-size: 17px; line-height: 1.5; color: var(--nuit);
    background: #fff; border: 0; padding: 22px 20px;
  }
  .avis:nth-child(even) { background: var(--pale); }
  .avis:active { background: var(--jaune); }

  .propre {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: 608px; margin: 0 auto;
    font-size: 15px; font-weight: 700; color: #fff;
    background: var(--nuit); border: 0; padding: 16px;
  }

  /* Écran 3 : l'avis choisi */
  .feuille {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(16,35,53,.6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .panneau {
    background: #fff; width: 100%; max-width: 640px;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 92dvh; overflow-y: auto;
    animation: monte .22s ease-out;
  }
  @keyframes monte { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .panneau { animation: none; } }
  .panneau h2 { font-size: 30px; font-weight: 900; font-stretch: 75%; }
  textarea {
    width: 100%; margin-top: 12px; min-height: 140px; resize: vertical;
    font-size: 16px; line-height: 1.5; color: var(--nuit);
    border: 0; padding: 14px; background: var(--pale);
  }
  textarea:focus { outline: 2px solid var(--bleu); outline-offset: -2px; background: #fff; }
  .compteur { font-size: 13px; color: var(--gris); margin-top: 6px; text-align: right; }
  .compteur.court { color: #B3261E; }
  .astuce { font-size: 13px; color: var(--gris); margin-top: 4px; line-height: 1.45; }

  .etapes { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
  .etapes li { display: flex; gap: 10px; align-items: center; font-size: 15px; }
  .etapes b {
    flex: none; width: 24px; height: 24px;
    background: var(--jaune); color: var(--nuit);
    display: grid; place-items: center; font-size: 13px;
  }

  .publier {
    width: 100%; font-size: 18px; font-weight: 800; cursor: pointer;
    background: var(--jaune); color: var(--nuit); border: 0; padding: 18px;
  }
  .publier:disabled { opacity: .4; }
  .retour {
    width: 100%; margin-top: 8px; background: none; border: 0; padding: 12px; cursor: pointer;
    font-size: 15px; font-weight: 500; color: var(--gris);
  }

  .toast {
    position: fixed; left: 50%; top: calc(20px + env(safe-area-inset-top)); z-index: 20;
    transform: translateX(-50%);
    background: var(--nuit); color: #fff; font-size: 15px; font-weight: 600;
    padding: 12px 20px;
  }
</style>
</head>
<body class="ecran-qui">

<header>
  <div class="logo">ixina<span>Tour & Taxis</span></div>
  <h1>Merci pour votre visite !</h1>
  <p id="sous-titre">Qui vous a reçu aujourd'hui ?</p>
</header>

<section class="qui" id="qui"></section>

<main id="liste" hidden></main>
<button class="propre" id="propre" hidden>Écrire mon propre avis</button>

<div class="feuille" id="feuille" hidden>
  <div class="panneau" role="dialog" aria-modal="true" aria-labelledby="titre-feuille">
    <h2 id="titre-feuille">Votre avis</h2>
    <textarea id="texte" aria-label="Texte de votre avis"></textarea>
    <div class="compteur" id="compteur"></div>
    <p class="astuce">Ajoutez votre touche si vous voulez : votre commune, un détail de votre projet.</p>
    <ol class="etapes">
      <li><b>1</b>Choisissez vos étoiles</li>
      <li><b>2</b>Appui long dans la case, puis « Coller »</li>
      <li><b>3</b>Touchez « Publier »</li>
    </ol>
    <button class="publier" id="publier">Copier et ouvrir Google</button>
    <button class="retour" id="retour">Choisir un autre avis</button>
  </div>
</div>

<div class="toast" id="toast" hidden>Texte copié ✓</div>

<script src="avis.js"></script>
<script>
  const lienGoogle = "https://search.google.com/local/writereview?placeid=" + MAGASIN.placeId;
  const $ = (id) => document.getElementById(id);

  let conseiller = null;       // prénom choisi, ou "" pour « quelqu'un d'autre »
  let pris = new Set();        // avis déjà utilisés par d'autres clients (Google Sheet)
  let ajouts = [];             // avis ajoutés à la main dans le Google Sheet
  let choisi = null;           // avis ouvert en ce moment

  // Ordre mélangé à chaque visite.
  const hasard = new Map(AVIS.map((a) => [a[0], Math.random()]));

  // Liste des avis déjà pris : la page marche aussi sans, elle montre alors tout.
  if (MAGASIN.script) {
    fetch(MAGASIN.script + "?action=liste")
      .then((r) => r.json())
      .then((d) => {
        pris = new Set(d.pris || []);
        ajouts = (d.ajouts || []).map((a) => [a.id, a.texte]);
        ajouts.forEach((a) => hasard.set(a[0], Math.random()));
        if (conseiller !== null) afficherListe();
      })
      .catch(() => {});
  }

  function personnaliser(texte) {
    const nom = conseiller || "notre conseiller";
    const Nom = conseiller || "Notre conseiller";
    return texte.replaceAll("{c}", nom).replaceAll("{C}", Nom);
  }

  function libres() {
    const tous = AVIS.concat(ajouts);
    const restants = tous.filter((a) => !pris.has(a[0]));
    // Quand presque tout est pris, on remontre tout plutôt qu'une page vide.
    return restants.length >= 10 ? restants : tous;
  }

  function afficherQui() {
    $("qui").innerHTML = "";
    for (const nom of MAGASIN.conseillers) {
      const b = document.createElement("button");
      b.textContent = nom;
      b.onclick = () => choisirConseiller(nom);
      $("qui").appendChild(b);
    }
    const autre = document.createElement("button");
    autre.className = "autre";
    autre.textContent = "Quelqu'un d'autre";
    autre.onclick = () => choisirConseiller("");
    $("qui").appendChild(autre);
  }

  function choisirConseiller(nom) {
    conseiller = nom;
    document.querySelector("header").dataset.nom = nom;
    document.body.classList.remove("ecran-qui");
    $("qui").hidden = true;
    $("liste").hidden = false;
    $("propre").hidden = false;
    $("sous-titre").innerHTML = "";
    $("sous-titre").append(
      (nom ? `Reçu par ${nom}. ` : "") + "Touchez l'avis qui vous ressemble."
    );
    const changer = document.createElement("button");
    changer.className = "changer";
    changer.textContent = nom ? "Changer" : "Changer de conseiller";
    changer.onclick = revenirQui;
    $("sous-titre").append(changer);
    afficherListe();
    window.scrollTo({ top: 0 });
  }

  function revenirQui() {
    conseiller = null;
    delete document.querySelector("header").dataset.nom;
    document.body.classList.add("ecran-qui");
    $("qui").hidden = false;
    $("liste").hidden = true;
    $("propre").hidden = true;
    $("sous-titre").textContent = "Qui vous a reçu aujourd'hui ?";
  }

  function afficherListe() {
    $("liste").innerHTML = "";
    const liste = libres().sort((a, b) => hasard.get(a[0]) - hasard.get(b[0]));
    for (const a of liste) {
      const b = document.createElement("button");
      b.className = "avis";
      b.textContent = personnaliser(a[1]);
      b.onclick = () => ouvrir(a);
      $("liste").appendChild(b);
    }
  }

  function ouvrir(avis) {
    choisi = avis;
    $("texte").value = avis ? personnaliser(avis[1]) : "";
    $("titre-feuille").textContent = avis ? "Votre avis" : "Votre propre avis";
    compter();
    $("feuille").hidden = false;
    document.body.style.overflow = "hidden";
    if (!avis) $("texte").focus();
  }

  function fermer() {
    $("feuille").hidden = true;
    document.body.style.overflow = "";
  }

  function compter() {
    const n = $("texte").value.trim().length;
    const manque = MAGASIN.minCaracteres - n;
    $("compteur").textContent = manque > 0 ? `Encore ${manque} caractères` : `${n} caractères ✓`;
    $("compteur").classList.toggle("court", manque > 0);
    $("publier").disabled = manque > 0;
  }

  function copier(texte) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texte).catch(() => copierAncien(texte));
    }
    return Promise.resolve(copierAncien(texte));
  }

  function copierAncien(texte) {
    const t = document.createElement("textarea");
    t.value = texte;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    t.setSelectionRange(0, texte.length);
    document.execCommand("copy");
    t.remove();
  }

  // Note l'avis comme pris dans le Google Sheet, sans faire attendre le client.
  function marquerPris(avis, texte) {
    pris.add(avis[0]);
    if (!MAGASIN.script) return;
    const reste = AVIS.concat(ajouts).filter((a) => !pris.has(a[0])).length;
    const params = new URLSearchParams({
      action: "prendre",
      id: avis[0],
      conseiller: conseiller || "Autre",
      texte,
      reste,
    });
    fetch(MAGASIN.script + "?" + params, { mode: "no-cors", keepalive: true }).catch(() => {});
  }

  $("texte").addEventListener("input", compter);
  $("retour").onclick = fermer;
  $("feuille").onclick = (e) => { if (e.target === $("feuille")) fermer(); };
  $("propre").onclick = () => ouvrir(null);

  $("publier").onclick = () => {
    const texte = $("texte").value.trim();
    if (choisi) marquerPris(choisi, texte);
    copier(texte).then(() => {
      $("toast").hidden = false;
      setTimeout(() => { window.location.href = lienGoogle; }, 700);
    });
  };

  afficherQui();
</script>
</body>
</html>
